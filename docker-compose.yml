version: '3'
services:
  # PHP Application
  app:
    build:
      context: ./docker/app
    container_name: kueku-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kueku-network
    depends_on:
      - db

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: kueku-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kueku-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: kueku-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kueku}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-kueku}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - kueku-data:/var/lib/mysql
    networks:
      - kueku-network

# Networks
networks:
  kueku-network:
    driver: bridge

# Volumes
volumes:
  kueku-data: